description: Hi, I'm Sasank Nunna

Welcome to my portfolio!

I am a senior at Purdue University pursuing a dual degree in Business Analytics & Information Management and Supply Chain & Operations Management, with a minor in Computer Science. My academic background combines data analytics, business strategy, and operations research, allowing me to solve complex business problems using data-driven decision making.

This portfolio showcases projects that demonstrate my skills in SQL, Python, Tableau, Power BI, Excel, machine learning, statistical analysis, data visualization, forecasting, optimization, and business intelligence. Each project is designed to solve real-world business challenges and highlights not only the technical implementation but also the business insights and recommendations derived from the data.

My interests lie at the intersection of business analytics, supply chain optimization, financial analytics, operations research, forecasting, and decision science. I enjoy transforming raw data into actionable insights that improve operational efficiency, support strategic decision-making, and create measurable business value.

As I continue to grow as an analyst, I am particularly interested in building expertise in analytics-driven problem solving within industries such as manufacturing, supply chain, finance, and technology.

Thank you for visiting my portfolio. Feel free to explore my projects, certifications, and technical skills, and don't hesitate to reach out if you'd like to connect or discuss opportunities.

